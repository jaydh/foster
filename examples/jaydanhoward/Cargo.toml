[package]
name = "jaydanhoward"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jaydanhoward"
path = "src/main.rs"

[dependencies]
foster-core = { path = "../../crates/foster-core" }
foster-server = { path = "../../crates/foster-server" }
foster-testgen = { path = "../../crates/foster-testgen" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
kube = { version = "3.1", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["v1_31"] }
rustls = "0.23"
sgp4 = "2.1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
