[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "counter"
path = "src/main.rs"

[dependencies]
foster-core = { path = "../../crates/foster-core" }
foster-server = { path = "../../crates/foster-server" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
